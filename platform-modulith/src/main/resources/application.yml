datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/mmo_platform`}
    username: ${JDBC_USER:`postgres`}
    password: ${JDBC_PASSWORD:`postgres`}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 20
    minimum-idle: 5

flyway:
  datasources:
    default:
      enabled: true
      clean-on-validation-error: false
com:
  example:
    demo:
      gateway:
        port: 8888
        hostname: localhost
        nodeId: 1
        rate-limit:
          capacity: 50
          refill-rate: 20
      login:
        port: 9998
        hostname: localhost
      lobby:
        port: 9999
        hostname: localhost
      world:
        port: 9996
        hostname: localhost
      zone:
        port: 9997
        hostname: localhost