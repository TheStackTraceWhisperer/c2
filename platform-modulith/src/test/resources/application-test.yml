datasources:
  default:
    url: ${JDBC_URL:`jdbc:tc:postgresql:16-alpine:///mmo_platform`}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    dialect: POSTGRES
    maximum-pool-size: 10
    minimum-idle: 2

flyway:
  datasources:
    default:
      enabled: true
      clean-on-validation-error: true

com:
  example:
    demo:
      gateway:
        port: 8888
        hostname: localhost
        nodeId: 1
        rate-limit:
          capacity: 50
          refill-rate: 20
      login:
        port: 9998
        hostname: localhost
      lobby:
        port: 9999
        hostname: localhost
      world:
        port: 9996
        hostname: localhost
      zone:
        port: 9997
        hostname: localhost