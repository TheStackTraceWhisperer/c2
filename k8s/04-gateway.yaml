apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer
  ports:
    - port: 8888
      targetPort: 8888
      protocol: UDP
      name: quic
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-health
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: platform-modulith:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
              protocol: UDP
              name: quic
            - containerPort: 8080
              protocol: TCP
              name: http-health
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: platform-common-config
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "gateway"
            - name: DATASOURCES_DEFAULT_ENABLED
              value: "false"
            - name: FLYWAY_DATASOURCES_DEFAULT_ENABLED
              value: "false"
            - name: APP_GATEWAY_HOST
              value: "0.0.0.0"
            - name: APP_GATEWAY_PORT
              value: "8888"
            - name: APP_GATEWAY_NODE_ID
              value: "1"
            - name: APP_GATEWAY_RATE_CAPACITY
              value: "50"
            - name: APP_GATEWAY_RATE_REFILL
              value: "20"